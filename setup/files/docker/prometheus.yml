global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Expose your API metrics at http://localhost:8080/metrics to scrape it.
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8080"]
