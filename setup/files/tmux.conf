# ─── Comportamento básico ─────────────────────────────
set -g default-shell /bin/bash
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides ",xterm-ghostty:Tc"
set -sg escape-time 10
set -g focus-events on
set -g history-limit 100000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g repeat-time 1000

# ─── Nomes de window ficam do jeito que eu renomear ───
set -g allow-rename off
setw -g automatic-rename off

# ─── Não cortar o nome da sessão/status na barra ──────
set -g status-left-length 40
set -g status-right-length 60

# ─── Prefix: troca de Ctrl+B pra Ctrl+A ───────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ─── Split de panes mais intuitivo ────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ─── Navegação entre panes com Alt+hjkl ───────────────
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# ─── Navegação entre windows: prefix + n/p, repetível ─
bind -r n next-window
bind -r p previous-window

# ─── Redimensionar panes: prefix + H/J/K/L, repetível ─
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ─── Recarregar config ────────────────────────────────
bind r source-file ~/.tmux.conf \; display "Config recarregada!"

# ─── Popup persistente (prefix + g) ───────────────────
# Cada diretório tem sua própria sessão "claude-<pasta>" rodando em
# background, com um bash normal dentro. O popup só faz attach/detach
# nela, então fechar o popup (prefix + d de dentro dele) NÃO mata a
# sessão — na próxima vez que abrir no mesmo diretório, retoma de onde
# parou (histórico, processos em foreground, etc).
bind g run-shell '\
    case "#{session_name}" in \
      claude-*) tmux detach-client ;; \
      *) \
        SESSION="claude-$(basename "#{pane_current_path}")"; \
        tmux has-session -t "$SESSION" 2>/dev/null \
          || { tmux new-session -d -s "$SESSION" -c "#{pane_current_path}"; \
               tmux set -t "$SESSION" status-position top; }; \
        tmux display-popup -w 80% -h 80% -E "tmux attach-session -t $SESSION" ;; \
    esac'

# ─── Clear total (visual + scrollback) — equiv. ao Cmd+K do Ghostty ────
# Prefix + Ctrl+l: limpa tela + apaga scrollback do pane
bind C-l send-keys C-l \; run-shell "sleep 0.1" \; clear-history \; display "Histórico limpo"

# ─── Plugins (tpm) ────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux'

# Continuum: salva sessões a cada 15min e restaura no boot
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Catppuccin theme
set -g @catppuccin_flavor 'mocha'

run '~/.tmux/plugins/tpm/tpm'

# ─── Catppuccin usa #T (pane title) no nome da window; ────────
# ─── troca pra #W (window name) pra respeitar o rename manual ─
set -wg window-status-format "#[fg=#11111b,bg=#{@thm_overlay_2}] #I #[fg=#cdd6f4,bg=#{@thm_surface_0}] #W "
set -wg window-status-current-format "#[fg=#11111b,bg=#{@thm_mauve}] #I #[fg=#cdd6f4,bg=#{@thm_surface_1}] #W "
